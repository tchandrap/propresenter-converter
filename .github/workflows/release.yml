name: Build and release

# Push a tag like v0.1.0 (it must match "version" in app/package.json) to build SlideBridge for Apple Silicon and
# Intel Macs and publish both .dmg files as a GitHub release. "Run workflow" (manual) only builds and keeps the
# .dmg files as downloadable artifacts, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15          # Apple Silicon
            expect: arm64
          - arch: x64
            runner: macos-15-intel    # Intel
            expect: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"

      - name: Engine self-test (Python)
        run: |
          python3 -m pip install -r engine/requirements.txt
          python3 tests/engine_test.py python3 engine/pp2mp4.py

      - name: Build the app and the .dmg
        run: bash scripts/build-macos.sh

      - name: Check the built app (CPU type, bundled engine, self-test of the frozen engine)
        run: |
          APP="$(cat build/last-app-path.txt)"
          ENGINE="$APP/Contents/Resources/pp2mp4-engine/pp2mp4-engine"
          file "$ENGINE" "$APP/Contents/MacOS/SlideBridge"
          file "$ENGINE" | grep -q "${{ matrix.expect }}"
          file "$APP/Contents/MacOS/SlideBridge" | grep -q "${{ matrix.expect }}"
          test -x "$APP/Contents/Resources/rtf2png"
          python3 tests/engine_test.py "$ENGINE"
          for i in 1 2 3 4 5; do hdiutil verify dist/*.dmg && break; echo "disk image busy, retry $i"; sleep 5; [ "$i" = 5 ] && exit 1; done

      - uses: actions/upload-artifact@v4
        with:
          name: SlideBridge-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: SlideBridge-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg > SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Convert ProPresenter playlist items to MP4 video or PDF.

          **Download**
          - Apple Silicon Macs (M1 and newer): `SlideBridge-*-arm64.dmg`
          - Intel Macs: `SlideBridge-*-x64.dmg`
          - Not sure? Apple menu, About This Mac: "Chip: Apple M..." means Apple Silicon, "Processor: Intel" means Intel.

          **First open (the app is not notarized by Apple)**
          1. Open the .dmg and drag SlideBridge to Applications.
          2. In Applications, right-click SlideBridge, choose Open, then Open again.
          3. If macOS says the app is damaged, run once in Terminal: `xattr -dr com.apple.quarantine /Applications/SlideBridge.app`

          SlideBridge only reads ProPresenter files; it never changes your ProPresenter library.
          `SHA256SUMS.txt` lets you check the downloads.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "SlideBridge ${GITHUB_REF_NAME#v}" --notes-file notes.md
