<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideBridge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="logo.png" alt="" class="logo"><div>SlideBridge<br><span>ProPresenter converter to MP4 / PDF</span></div></div>
    <div class="side-h">Sources</div>
    <div id="sources"></div>
    <button id="open-pl" class="btn ghost wide">Open .proplaylist file…</button>
    <button id="refresh" class="btn ghost wide">Refresh</button>
    <div class="side-h">Playlists</div>
    <input id="filter" class="input" type="search" placeholder="Filter playlists">
    <div id="tree"></div>
  </aside>

  <main id="main">
    <nav id="tabs">
      <button class="tab on" data-tab="playlist">Playlist items</button>
      <button class="tab" data-tab="placeholders">Placeholders <span id="ph-count" class="pill"></span></button>
      <button class="tab" data-tab="help">Not in the list?</button>
    </nav>

    <section id="view-playlist" class="view on">
      <div class="cols">
        <div class="col items">
          <div class="col-h"><span id="pl-title">Pick a playlist</span>
            <span class="spacer"></span>
            <button id="sel-all" class="link">Select all</button><button id="sel-none" class="link">None</button></div>
          <div id="items" class="list"></div>
        </div>
        <div class="col preview">
          <div class="col-h"><span id="pv-title">Preview</span><span class="spacer"></span><span id="pv-meta" class="muted"></span></div>
          <div id="pv-opts" class="pv-opts pp" hidden></div>
          <div id="pv" class="pv"><div class="empty">Click an item to see its slides the way ProPresenter shows them.</div></div>
        </div>
      </div>
    </section>

    <section id="view-placeholders" class="view">
      <div class="ph-head">
        <input id="ph-filter" class="input" type="search" placeholder="Filter placeholders or playlists">
        <label class="chk"><input id="ph-empty" type="checkbox"> only empty placeholders</label>
        <span class="muted" id="ph-src"></span>
      </div>
      <div id="ph-table" class="list"></div>
    </section>

    <section id="view-help" class="view">
      <div class="help" id="help"></div>
    </section>

    <footer id="bar" class="pp">
      <div class="bar-row">
        <div class="pp-tabs" role="group" aria-label="Export format">
          <button id="fmt-mp4" class="pp-tab" type="button" aria-pressed="false" title="Make a video (MP4). Click to turn on or off."><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg><span>MP4</span></button>
          <button id="fmt-pdf" class="pp-tab" type="button" aria-pressed="false" title="Make a PDF, one page per slide. Click to turn on or off."><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h6M9.5 15.5h6"/></svg><span>PDF</span></button>
        </div>
        <span id="out-path" class="path grow"></span>
        <span id="make-wrap" class="tipwrap"><button id="make" class="btn primary" disabled>Export…</button><span id="make-tip" class="tip" role="tooltip"></span></span>
        <button id="cancel" class="btn danger" hidden>Cancel</button>
      </div>
      <div id="prog" class="prog" hidden>
        <div class="prog-bar"><div id="prog-fill"></div></div>
        <div id="prog-text" class="muted"></div>
      </div>
      <div id="result" class="result" hidden></div>
    </footer>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
